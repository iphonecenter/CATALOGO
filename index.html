    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

    body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #f5f5f7;

    /* CONFIGURACIÓN PARA PC Y PANTALLAS GRANDES */
    #productos {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
    }

    .card {
        background: #ffffff;

        border: 1px solid rgba(0, 0, 0, 0.04);
        overflow: hidden;
    }

    .img-container {
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 6px;
    }

    .card img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .card h2 {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.2px;
        color: #1d1d1f;
        margin-bottom: 2px;

        line-height: 1.2;
    }

    .detalles {
        color: #86868b;
        font-size: 10px;
        font-weight: 400;

    }

    .precio-destacado {

        color: #1d1d1f;
        margin-bottom: 8px;
    }

        margin-bottom: 8px;
        text-align: left;
        width: 100%;
    }

        font-size: 8px;
        font-weight: 600;
        color: #86868b;
        letter-spacing: 0.2px;
        margin-bottom: 6px;
        text-align: center;
        text-transform: uppercase;
    }

    .opciones-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
    }
